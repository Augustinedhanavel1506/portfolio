<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Augustine D | Full Stack Developer</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // This redirects a deep link like /portfolio/work/some-slug (which
      // GitHub Pages would otherwise 404 on) back to index.html with the
      // intended path encoded in the query string.
      var pathSegmentsToKeep = 1; // keep "/portfolio"
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
